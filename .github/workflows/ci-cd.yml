name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ==========================================
  # CI Jobs: Run on both `dev` and `main`
  # ==========================================
  backend-ci:
    name: Backend CI (Test & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Backend Typecheck & Build
        run: pnpm test && pnpm build

  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Frontend Linter
        run: pnpm run lint

      - name: Build Frontend Production Bundle
        run: pnpm run build

  # ==========================================
  # CD Job: Runs ONLY on `main` branch push
  # ==========================================
  deploy-main:
    name: Deploy Production (Main Branch)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Production Deployment Step
        run: |
          echo "Deploying application from main branch..."
          # Add deployment commands here (e.g. Docker build & push, AWS, Vercel, Render, etc.)
