services:
  mongo:
    image: mongo:7
    container_name: feedback_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - feedback_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedback_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/feedback
      - NODE_ENV=production
      - JWT_SECRET=prod_secret_change_me
    depends_on:
      - mongo
    networks:
      - feedback_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feedback_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - feedback_network

volumes:
  mongo_data:

networks:
  feedback_network:
    driver: bridge
